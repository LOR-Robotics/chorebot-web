<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Abstract outdoor wheeled chore robot">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8EDE4"/>
      <stop offset="100%" stop-color="#F4F7F5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B6B4A"/>
      <stop offset="100%" stop-color="#0F3D2E"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="24" fill="url(#sky)"/>
  <!-- Ground -->
  <path d="M0 250h480v70H0z" fill="#C5D9CE" opacity="0.55"/>
  <path d="M40 250c40-18 80-18 120 0s80 18 120 0 80-18 120 0 80-18 80 0v20H40z" fill="#A8C4B4" opacity="0.4"/>
  <!-- Soft hills -->
  <ellipse cx="90" cy="248" rx="70" ry="14" fill="#9BB8A8" opacity="0.35"/>
  <ellipse cx="380" cy="252" rx="90" ry="16" fill="#9BB8A8" opacity="0.3"/>
  <!-- Robot body (wheelbarrow-scale silhouette) -->
  <g transform="translate(110 95)">
    <!-- Bed / cargo -->
    <path d="M48 88h168c10 0 18-8 18-18V48c0-8-5-15-12-17L128 12c-4-1.2-8-1.2-12 0L42 31c-7 2-12 9-12 17v22c0 10 8 18 18 18z" fill="url(#body)"/>
    <!-- Side rail highlight -->
    <path d="M50 52h150" stroke="#E8F5EF" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    <!-- Sensor mast -->
    <rect x="158" y="8" width="8" height="36" rx="2" fill="#0F3D2E"/>
    <circle cx="162" cy="6" r="8" fill="#2A8F62"/>
    <circle cx="162" cy="6" r="3.5" fill="#E8F5EF"/>
    <!-- Attachment bay hint -->
    <rect x="72" y="58" width="44" height="22" rx="4" fill="#E8F5EF" opacity="0.2"/>
    <rect x="128" y="58" width="44" height="22" rx="4" fill="#E8F5EF" opacity="0.15"/>
    <!-- Wheels -->
    <circle cx="88" cy="118" r="28" fill="#0F3D2E"/>
    <circle cx="88" cy="118" r="18" fill="none" stroke="#E8F5EF" stroke-width="4" opacity="0.85"/>
    <circle cx="88" cy="118" r="6" fill="#E8F5EF"/>
    <circle cx="188" cy="118" r="28" fill="#0F3D2E"/>
    <circle cx="188" cy="118" r="18" fill="none" stroke="#E8F5EF" stroke-width="4" opacity="0.85"/>
    <circle cx="188" cy="118" r="6" fill="#E8F5EF"/>
    <!-- Soft shadow -->
    <ellipse cx="138" cy="152" rx="100" ry="10" fill="#0F3D2E" opacity="0.12"/>
  </g>
</svg>
